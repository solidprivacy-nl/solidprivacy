name: WP3 evidence and fact gates

on:
  pull_request:
    paths:
      - "src/**"
      - "contracts/**"
      - "evals/**"
      - "tests/**"
      - "skills/document_processing/extract_privacy_facts/**"
      - "workflows/document_to_dpia/**"
      - "ROADMAP.md"
      - "README.md"
      - "workflows/README.md"
      - "docs/workpackages/WP3_EVIDENCE_FACTS.md"
      - "pyproject.toml"
      - ".github/workflows/wp3-evidence-gate.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - "src/**"
      - "contracts/**"
      - "evals/**"
      - "tests/**"
      - "skills/document_processing/extract_privacy_facts/**"
      - "workflows/document_to_dpia/**"
      - "ROADMAP.md"
      - "README.md"
      - "workflows/README.md"
      - "docs/workpackages/WP3_EVIDENCE_FACTS.md"
      - "pyproject.toml"
      - ".github/workflows/wp3-evidence-gate.yml"

permissions:
  contents: read

jobs:
  evidence-fact-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run full deterministic regression suite
        run: python -m pytest

      - name: Validate evidence-pack fixtures
        run: |
          solidprivacy validate-evidence-pack evals/evidence_packs/dpia_evidence_ready.json
          solidprivacy validate-evidence-pack evals/evidence_packs/dpia_evidence_blocked.json

      - name: Check evidence readiness CLI
        run: |
          solidprivacy evidence-readiness evals/evidence_packs/dpia_evidence_ready.json --stage analysis
          solidprivacy evidence-readiness evals/evidence_packs/dpia_evidence_blocked.json --stage analysis

      - name: Preserve inherited DPIA and pre-scan gates
        run: |
          solidprivacy validate-dpia evals/synthetic_cases/dpia_nl_basic.json
          solidprivacy validate-dpia evals/synthetic_cases/dpia_nl_high_risk.json
          solidprivacy prescan evals/prescan_smoke_input.json

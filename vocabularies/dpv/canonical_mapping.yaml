policy:
  - Do not infer legal compliance from a DPV mapping.
  - Keep SolidPrivacy identifiers stable even when DPV evolves.
  - Version mappings and regression-test them before changing canonical semantics.
  - Prefer DPV extensions for jurisdiction-specific semantics where appropriate, but legal claims must still cite approved legal sources.

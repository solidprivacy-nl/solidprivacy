[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solidprivacy-runtime"
version = "0.4.0"
description = "Deterministic runtime gates for SolidPrivacy privacy workflows"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
solidprivacy = "solidprivacy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
